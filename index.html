<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간석기 주먹밥 | 소장품 검색</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#222;font-family:Georgia,"Apple SD Gothic Neo",serif}header,main,footer{padding:24px;max-width:850px;margin:auto}header{border-bottom:1px solid #bbb}small{font-size:11px;letter-spacing:2px;color:#777}h1{font-size:27px;font-weight:500}main{min-height:70vh}form{display:flex;gap:8px;margin:30px 0}input{padding:16px;border:1px solid #aaa;background:white;font-size:20px;min-width:0;flex:1}button{background:#262626;color:white;border:0;padding:0 24px;cursor:pointer}section{border-top:1px solid #bbb;padding-top:22px}img{display:block;max-height:450px;max-width:100%;margin:15px auto;object-fit:contain}table{border-collapse:collapse;width:100%}td{border-bottom:1px solid #ddd;padding:16px 8px}td:first-child{color:#777;width:40%}.muted{color:#777}footer{font-size:12px;color:#888}</style></head><body><header><small>COLLECTION ARCHIVE · 2026</small><h1>간석기 주먹밥</h1><small>소장품 검색 시스템</small></header><main><p>소장품의 등록 번호를 입력하세요.</p><form id="search"><input id="number" inputmode="numeric" maxlength="3" placeholder="예: 017" aria-label="소장품 번호" value="017"><button>조회</button></form><div id="result" aria-live="polite"></div></main><footer>GANSEOKGI RICE BALL · ARCHIVE 2026</footer><script>const records={"017":{wax:"50g",seaweed:"5g",origin:"국내산",image:"images/017.jpg"}};const result=document.getElementById("result");function show(){let n=document.getElementById("number").value.trim().padStart(3,"0");let d=records[n];if(!d){result.innerHTML='<section><p>해당 번호의 소장품은 아직 등록되지 않았습니다.</p></section>';return}result.innerHTML='<section><small>REGISTERED SPECIMEN · '+n+'</small><h2>간석기 주먹밥 '+n+'</h2><img src="'+d.image+'" alt="간석기 주먹밥 '+n+' 단독 사진"><table><tr><td>등록 번호</td><td>'+n+'</td></tr><tr><td>양초</td><td>'+d.wax+'</td></tr><tr><td>김</td><td>'+d.seaweed+'</td></tr><tr><td>김 원산지</td><td>'+d.origin+'</td></tr></table></section>'}document.getElementById("search").addEventListener("submit",e=>{e.preventDefault();show()});show();</script></body></html>
