<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간석기 주먹밥 — 소장품 검색</title><style>body{font-family:Georgia,'Apple SD Gothic Neo',serif;background:#f6f5f2;color:#242424;margin:0}header,main{max-width:780px;margin:auto;padding:25px}header{border-bottom:1px solid #bbb}small{color:#777;letter-spacing:2px}h1{font-size:27px;font-weight:400}main{padding-top:65px}form{display:flex;gap:10px;margin:30px 0}input{flex:1;min-width:0;font-size:23px;padding:15px;background:white;border:1px solid #aaa}button{padding:12px 24px;background:#222;color:white;border:0;cursor:pointer}article{border-top:1px solid #bbb;padding-top:24px}img{width:100%;max-height:550px;object-fit:contain;background:white}dl div{display:flex;border-bottom:1px solid #ddd;padding:18px 0}dt,dd{width:50%;margin:0}dt{color:#777}footer{font-size:12px;color:#777;padding:40px 25px;text-align:center}</style><header><small>COLLECTION ARCHIVE · 2026</small><h1>간석기 주먹밥</h1><small>소장품 검색 시스템</small></header><main><p>소장품 번호를 입력하세요.</p><form id="search"><input id="number" value="1" inputmode="numeric" placeholder="예: 1" aria-label="소장품 번호"><button>조회</button></form><section id="result"></section></main><footer>GANSEOKGI RICE BALL · ARCHIVE 2026</footer><script>const data={'1':{image:'images/017.jpg',wax:'50g',seaweed:'5g',origin:'국내산'}};function show(){const n=String(Number(document.getElementById('number').value));const r=data[n];const el=document.getElementById('result');el.replaceChildren();if(!r){el.textContent='해당 번호의 소장품은 아직 등록되지 않았습니다.';return}const a=document.createElement('article');const title=document.createElement('h2');title.textContent='간석기 주먹밥 '+n;const img=document.createElement('img');img.src=r.image;img.alt='간석기 주먹밥 '+n;const dl=document.createElement('dl');[['양초',r.wax],['김',r.seaweed],['김 원산지',r.origin]].forEach(([k,v])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;row.append(dt,dd);dl.append(row)});a.append(title,img,dl);el.append(a)}document.getElementById('search').onsubmit=e=>{e.preventDefault();show()};show();</script></html>
